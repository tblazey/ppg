[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppg"
version = "0.1.0"
description = "Tools for kinetic modeling of dynamic PET data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Tyler Blazey", email = "blazey@wustl.edu" },
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "matplotlib>=3.5",
    "nibabel>=4.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7", "black>=24"]

[project.scripts]
cbf-opt = "ppg.scripts.cbf_opt:main"
cmr-opt = "ppg.scripts.cmr_opt:main"
ohta-opt = "ppg.scripts.ohta_opt:main"
aif-fit = "ppg.scripts.aif_fit:main"
oef-opt = "ppg.scripts.oef_opt:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ppg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]
